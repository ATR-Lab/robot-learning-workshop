services:
  workshop:
    image: ${WORKSHOP_IMAGE:-robot-learning-workshop:dev}
    build: .
    platform: linux/amd64
    gpus: all
    shm_size: "8gb"
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ./data/home:/root
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
      GVHMR_BODY_MODELS: /workspace/data/body_models
      GVHMR_CHECKPOINTS: /workspace/data/checkpoints
      GVHMR_DEVICE: cuda
      HF_HOME: /workspace/data/cache/huggingface
      XDG_CACHE_HOME: /workspace/data/cache
      MUJOCO_GL: egl
      WORKSHOP_SOFTWARE_GL: ${WORKSHOP_SOFTWARE_GL:-}
  sim:
    image: robot-learning-workshop-sim:dev
    build:
      context: .
      dockerfile: Dockerfile.sim
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - "127.0.0.1:${SIM_PORT:-8080}:8080"
    environment:
      SIM_DOCKER: "1"
      SIM_PUBLIC_PORT: "${SIM_PORT:-8080}"
      MUJOCO_GL: egl
      PYTHONUNBUFFERED: "1"
